name: Build mod

# Runs on every push, and can also be started by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle build --stacktrace

      - name: Upload the finished mod
        uses: actions/upload-artifact@v4
        with:
          name: npc-crowd-jar
          # The plain jar is the one to install. Loom also produces -sources
          # and -dev jars in here, which you can ignore.
          path: build/libs/*.jar
          if-no-files-found: error
